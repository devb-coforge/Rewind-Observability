services:
  obs:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HOME}/.claude:/sources/claude:ro
      - ${HOME}/.codex:/sources/codex:ro
      - obs-data:/data
    environment:
      OBS_SOURCES: /sources/claude,/sources/codex
      OBS_DATA_DIR: /data
      OBS_PRICING_FILE: /app/pricing.yaml
      PUID: ${PUID:-502}
      PGID: ${PGID:-20}
volumes:
  obs-data:
