services:
  obs:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HOME}/.claude:/sources/claude:ro
      - ${HOME}/.codex:/sources/codex:ro
      - ${HOME}/.cursor:/sources/cursor:ro
      - obs-data:/data
    environment:
      OBS_SOURCES: /sources/claude,/sources/codex,/sources/cursor
      OBS_DATA_DIR: /data
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
volumes:
  obs-data:
