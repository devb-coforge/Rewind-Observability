services:
  obs:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${HOME}/.claude:/sources/claude:ro
      - ${HOME}/.codex:/sources/codex:ro
      - ${HOME}/.cursor:/sources/cursor:ro
      - obs-data:/data
    environment:
      OBS_SOURCES: /sources/claude,/sources/codex,/sources/cursor
      OBS_DATA_DIR: /data
      PUID: ${PUID:-502}
      PGID: ${PGID:-20}
      OBS_OTEL_ENDPOINT: http://host.docker.internal:4318/v1/traces
      OBS_OTEL_PROTOCOL: http/protobuf
      OBS_OTEL_INCLUDE_CONTENT: "false"
volumes:
  obs-data:
