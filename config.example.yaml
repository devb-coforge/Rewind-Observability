# Copy to config.yaml and edit, or set OBS_SOURCES / OBS_CONFIG.
sources:
  - path: /sources/claude
  - path: /sources/codex
  - path: /sources/cursor

# Optional Cursor sidebar names (mount Cursor's User folder read-only here).
# cursor_user_data_dir: /sources/cursor/user-data

data_dir: /data
# Optional manual override; default pricing comes from OpenRouter's cached catalog.
# pricing_file: /app/pricing.yaml

otel:
  endpoint: ""            # empty disables export
  include_content: false  # true sends prompt and tool text off the machine
  protocol: http/protobuf

boundary:
  allow_prefixes: []
