# Copy to config.yaml and edit, or set OBS_SOURCES / OBS_CONFIG.
sources:
  - path: /sources/claude
    agent: claude_code
  - path: /sources/codex
    agent: codex

data_dir: /data
pricing_file: /app/pricing.yaml

otel:
  endpoint: ""            # empty disables export
  include_content: false  # true sends prompt and tool text off the machine
  protocol: http/protobuf

boundary:
  allow_prefixes: []
