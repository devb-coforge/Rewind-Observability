[project]
name = "obs"
version = "0.1.0"
description = "Local coding-agent session observability"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0",
  "opentelemetry-proto>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
