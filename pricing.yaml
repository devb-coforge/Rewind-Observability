# Estimated USD per million tokens for activity tracking, not billing.
# Longer names win. A model matches a key when it equals the key or continues
# with "-" (claude-sonnet-4-20250514 matches claude-sonnet-4).
# Models with no entry show as unknown cost. Override this file to change prices.
models:
  claude-opus-4: {input: 15, output: 75, cache_read: 1.5, cache_write: 18.75}
  claude-sonnet-4: {input: 3, output: 15, cache_read: 0.3, cache_write: 3.75}
  claude-3-7-sonnet: {input: 3, output: 15, cache_read: 0.3, cache_write: 3.75}
  claude-3-5-sonnet: {input: 3, output: 15, cache_read: 0.3, cache_write: 3.75}
  claude-3-5-haiku: {input: 0.8, output: 4, cache_read: 0.08, cache_write: 1}
  claude-3-haiku: {input: 0.25, output: 1.25, cache_read: 0.03, cache_write: 0.3}
  gpt-4.1-mini: {input: 0.4, output: 1.6}
  gpt-4.1: {input: 2, output: 8}
  gpt-4o-mini: {input: 0.15, output: 0.6}
  gpt-4o: {input: 2.5, output: 10, cache_read: 1.25}
  o4-mini: {input: 1.1, output: 4.4}
  o3-mini: {input: 1.1, output: 4.4}
  o3: {input: 2, output: 8}
